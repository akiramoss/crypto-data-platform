# Test profile: H2 in-memory database, no MySQL and no real CoinGecko calls.
# Activated with @ActiveProfiles("test") on @SpringBootTest / @DataJpaTest classes.

spring.application.name=crypto-data-platform-test

# DATABASE (H2 in-memory instead of the real MySQL from application.properties)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# LOGGING (keep test output readable)
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# API (dummy values; CryptoApiClient is mocked in tests, never called for real)
crypto.api.url=http://localhost/fake-api/coins/markets
crypto.api.vsCurrency=usd
crypto.api.order=market_cap_desc
crypto.api.perPage=10
crypto.api.key=test-key
