server {
    listen 80;

    # Proxy de /api/* al backend Spring Boot (nombre de servicio en docker-compose.yml).
    # Mismo origen que el frontend => el navegador nunca hace una request cross-origin,
    # así que CORS no entra en juego en este camino (solo en dev, con `npm run dev`).
    location /api/ {
        proxy_pass http://app:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        # SPA: cualquier ruta que no sea un fichero real cae en index.html (React Router).
        try_files $uri $uri/ /index.html;
    }
}
